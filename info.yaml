# Project configuration (Tiny Tapeout template format)
project:
  title:        "4x4 Array Multiplier"
  author:       "Team XXXX"            # <- put the team members' names here
  discord:      ""
  description:  "4x4-bit array multiplier with D flip-flop input/output registers"
  language:     "Verilog"
  clock_hz:     10000000              # 10 MHz (suggested clock frequency)

  tiles: "1x1"

  top_module:  "tt_um_multiplier_4x4"

  source_files:
    - "project.v"
    - "register_8.v"
    - "d_ff.v"
    - "ripple_carry_4.v"
    - "full_adder.v"

pinout:
  # Inputs
  ui[0]: "A0"
  ui[1]: "A1"
  ui[2]: "A2"
  ui[3]: "A3"
  ui[4]: "B0"
  ui[5]: "B1"
  ui[6]: "B2"
  ui[7]: "B3"

  # Outputs
  uo[0]: "P0"
  uo[1]: "P1"
  uo[2]: "P2"
  uo[3]: "P3"
  uo[4]: "P4"
  uo[5]: "P5"
  uo[6]: "P6"
  uo[7]: "P7"

  # Bidirectional pins (unused)
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
